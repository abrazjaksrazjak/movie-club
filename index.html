<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08080b">
    <meta name="color-scheme" content="dark">
    <title>JLL Movie Club – współdzielony ranking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e0c56e;
            --gold-glow: rgba(201, 168, 76, 0.35);
            --gold-soft: rgba(201, 168, 76, 0.1);
            --gold-soft-hover: rgba(201, 168, 76, 0.18);
            --bg-base: #08080b;
            --bg-surface: #101014;
            --bg-card: #141419;
            --bg-elevated: #1a1a21;
            --bg-input: #1c1c24;
            --border-default: #25252e;
            --border-hover: #333340;
            --border-gold: rgba(201, 168, 76, 0.25);
            --text-primary: #e8e8ed;
            --text-secondary: #a5a5b0;
            --text-muted: #6b6b78;
            --text-inverse: #0a0a0d;
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 26px;
            --radius-full: 9999px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.55);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.7);
            --shadow-gold: 0 0 24px rgba(201, 168, 76, 0.18);
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-xs: 0.7rem;
            --font-sm: 0.78rem;
            --font-md: 0.88rem;
            --font-lg: 1.05rem;
            --font-xl: 1.3rem;
            /* Wskaźnik koloru paska Safari – domyślnie ciemny */
            --ios-theme-bg: #08080b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none !important;
            -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale; }
        html {
            background: var(--bg-base);
            color-scheme: dark;
            touch-action: pan-y;
        }
        body {
            background: var(--bg-base);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(201, 168, 76, 0.04) 0%, transparent 55%),
            radial-gradient(ellipse at 80% 20%, rgba(120, 100, 60, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            height: 100vh; height: 100dvh; width: 100%;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            padding: env(safe-area-inset-top) 0 0 0;
            letter-spacing: -0.01em;
            touch-action: pan-y;
            position: relative; margin: 0;
            transition: background-color 0.6s ease, background-image 0.6s ease, color 0.6s ease;
        }
        * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }
        :focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

        /* ---- Wskaźniki koloru dla Safari 26 – kolor na pseudoelemencie ::before ---- */
        #ios-theme-color,
        #ios-theme-color-bottom {
            position: fixed;
            left: 0;
            right: 0;
            height: 2px;
            pointer-events: none;
            z-index: 9999;
            background: transparent; /* brak bezpośredniego tła – Safari próbkuje ::before */
        }
        #ios-theme-color { top: 0; }
        #ios-theme-color-bottom { bottom: 0; }
        #ios-theme-color::before,
        #ios-theme-color-bottom::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: var(--ios-theme-bg);
        }

        .global-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(28px) brightness(0.22) saturate(0.65);
            z-index: 0; pointer-events: none; transition: background-image 0.5s ease, filter 0.9s ease, opacity 0.5s ease;
        }

        .anime-decor {
            position: fixed; inset: 0; pointer-events: none;
            overflow: hidden; z-index: 0; display: none;
        }
        body.anime-mode .anime-decor { display: block; }
        .anime-decor::before {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 240px;
            background:
                radial-gradient(ellipse 60% 100% at 15% 100%, rgba(90, 117, 88, 0.32) 0%, transparent 70%),
                radial-gradient(ellipse 70% 100% at 50% 100%, rgba(122, 143, 106, 0.38) 0%, transparent 75%),
                radial-gradient(ellipse 60% 100% at 85% 100%, rgba(90, 117, 88, 0.32) 0%, transparent 70%),
                radial-gradient(ellipse 50% 100% at 30% 100%, rgba(168, 197, 214, 0.28) 0%, transparent 70%);
            pointer-events: none;
            animation: hillBreath 14s ease-in-out infinite alternate;
        }
        @keyframes hillBreath {
            from { transform: translateY(4px) scaleY(0.98); opacity: 0.9; }
            to   { transform: translateY(0) scaleY(1.02); opacity: 1; }
        }
        .leaf {
            position: absolute; top: -30px;
            border-radius: 0 100% 0 100%;
            box-shadow: 0 2px 8px rgba(60, 40, 20, 0.18);
            opacity: 0;
            animation-name: leafFall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            will-change: transform, opacity;
        }
        @keyframes leafFall {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
            8%   { opacity: 0.95; }
            92%  { opacity: 0.9; }
            100% { transform: translate3d(var(--sway, 60px), 108vh, 0) rotate(var(--rot, 720deg)); opacity: 0; }
        }

        .anime-grave-effects {
            position: fixed; inset: 0; pointer-events: none;
            overflow: hidden; display: none;
            z-index: 0;
        }
        .anime-grave-effects-front {
            position: fixed; inset: 0; pointer-events: none;
            overflow: hidden; display: none;
            z-index: 60;
        }
        body.grave-mode .anime-grave-effects,
        body.grave-mode .anime-grave-effects-front { display: block; }
        body.grave-mode .anime-decor { display: none; }
        body.grave-mode .anime-sunflare { opacity: 0 !important; }

        .smoke {
            position: absolute;
            bottom: -140px;
            border-radius: 50%;
            filter: blur(18px);
            opacity: 0;
            animation-name: smokeRise;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            will-change: transform, opacity;
            pointer-events: none;
        }
        @keyframes smokeRise {
            0%   { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
            15%  { opacity: 0.55; }
            55%  { opacity: 0.4; }
            100% { transform: translate3d(var(--sx, 40px), -118vh, 0) scale(2.7); opacity: 0; }
        }

        .spark {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            opacity: 0;
            animation-name: sparkRise;
            animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1);
            animation-iteration-count: infinite;
            will-change: transform, opacity;
            pointer-events: none;
        }
        @keyframes sparkRise {
            0%   { transform: translate3d(0, 0, 0) scale(1);   opacity: 0; }
            10%  { opacity: 1; }
            55%  { opacity: 0.9; }
            85%  { opacity: 0.35; }
            100% { transform: translate3d(var(--sx, 20px), -118vh, 0) scale(0.35); opacity: 0; }
        }
        .smoke.smoke-front { filter: blur(22px); }
        .spark.spark-front { filter: blur(0.4px); }

        .anime-sunflare {
            position: fixed;
            top: -120px;
            right: -120px;
            width: 520px;
            height: 520px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 1.4s ease;
            will-change: opacity, transform;
        }
        body.anime-mode .anime-sunflare { opacity: 1; }
        .anime-sunflare::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%,
                    rgba(255, 252, 220, 0.95) 0%,
                    rgba(255, 244, 200, 0.65) 12%,
                    rgba(255, 230, 170, 0.35) 28%,
                    rgba(255, 215, 150, 0.12) 50%,
                    transparent 72%);
            filter: blur(6px);
            animation: sunPulse 7s ease-in-out infinite;
        }
        .anime-sunflare::after {
            content: ''; position: absolute; inset: -60px;
            background: conic-gradient(from 0deg,
                transparent 0deg, rgba(255, 245, 200, 0.18) 6deg, transparent 14deg,
                transparent 40deg, rgba(255, 245, 200, 0.14) 46deg, transparent 54deg,
                transparent 90deg, rgba(255, 245, 200, 0.18) 96deg, transparent 106deg,
                transparent 150deg, rgba(255, 245, 200, 0.12) 156deg, transparent 168deg,
                transparent 220deg, rgba(255, 245, 200, 0.16) 226deg, transparent 238deg,
                transparent 290deg, rgba(255, 245, 200, 0.14) 296deg, transparent 306deg,
                transparent 360deg);
            border-radius: 50%;
            filter: blur(10px);
            animation: sunRotate 42s linear infinite;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 20%, #000 38%, transparent 78%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 20%, #000 38%, transparent 78%);
        }
        @keyframes sunPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50%      { transform: scale(1.08); opacity: 1; }
        }
        @keyframes sunRotate {
            to { transform: rotate(360deg); }
        }

        .app-container {
            width: 100%; max-width: 960px; margin: 0 auto;
            display: flex; flex-direction: column; height: 100%; height: 100dvh;
            padding: 1rem 1rem 0.8rem 1rem; overflow: hidden; gap: 0.8rem;
            position: relative; z-index: 1;
        }
        .club-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; padding: 0.3rem 0.6rem;
            background: var(--bg-surface); border-radius: var(--radius-lg);
            border: 1px solid var(--border-default); box-shadow: var(--shadow-sm);
            gap: 0.5rem; z-index: 20; position: relative;
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .club-header h1 {
            font-size: var(--font-lg); font-weight: 700; letter-spacing: 0.06em;
            cursor: pointer; transition: background-position var(--transition-smooth), filter var(--transition-fast), background 0.6s ease;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--gold-light) 40%, var(--gold) 100%);
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% 100%; background-position: 0% 50%;
            display: flex; align-items: center; gap: 0.35rem; white-space: nowrap;
        }
        .club-header h1:hover { background-position: 100% 50%; filter: brightness(1.2); }
        .admin-indicator {
            display: none; width: 9px; height: 9px; border-radius: 50%; background: var(--gold);
            box-shadow: 0 0 8px var(--gold-glow); flex-shrink: 0; cursor: pointer;
            vertical-align: middle; transition: transform 0.15s;
        }
        .admin-indicator.active { display: inline-block; }
        .admin-indicator:hover { transform: scale(1.3); }
        .header-buttons { display: flex; gap: 0.35rem; align-items: center; }
        .icon-btn {
            background: var(--bg-elevated); border: 1px solid var(--border-default); color: var(--text-secondary);
            cursor: pointer; width: 36px; height: 36px; border-radius: var(--radius-sm);
            transition: color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), background 0.5s ease;
            display: inline-flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 0;
        }
        .icon-btn.admin-only { opacity: 0.45; }
        .icon-btn.admin-only:hover { opacity: 1; }
        .icon-btn::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, var(--gold-soft) 0%, transparent 70%); opacity: 0; transition: opacity var(--transition-fast); }
        .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; position: relative; z-index: 1; transition: transform var(--transition-fast); fill: none; }
        .icon-btn:hover { color: var(--gold); border-color: var(--border-gold); transform: translateY(-1px); box-shadow: var(--shadow-gold); }
        .icon-btn:hover::after { opacity: 1; }
        .icon-btn:hover svg { transform: scale(1.1); }
        .icon-btn:active { transform: scale(0.94); transition: transform 0.08s ease; }

        .anime-toggle-btn {
            font-family: 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho Pro', serif;
            font-size: 1.1rem; font-weight: 700; line-height: 1;
            color: var(--text-secondary);
            padding-bottom: 3px;
        }
        .anime-toggle-btn.active {
            color: var(--gold-light);
            border-color: var(--border-gold);
            box-shadow: var(--shadow-gold);
            background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.05));
        }
        body.anime-mode .anime-toggle-btn.active {
            color: #fffbf0;
            background: linear-gradient(135deg, #d4a95c, #b8894a);
            border-color: #b8894a;
            box-shadow: 0 0 18px rgba(184, 137, 74, 0.55);
        }
        .anime-toggle-btn::after { display: none; }

        #mainContent { flex: 1; min-height: 0; position: relative; width: 100%; border-radius: var(--radius-lg); transition: opacity 0.2s ease; background: transparent; overflow: hidden; }
        .loading-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-elevated); backdrop-filter: blur(16px); border-radius: var(--radius-xl); padding: 1.5rem 2rem; text-align: center; z-index: 10; border: 1px solid var(--border-gold); box-shadow: var(--shadow-lg), var(--shadow-gold); display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(201, 168, 76, 0.15); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem 1rem;
            min-height: 120px;
        }
        .empty-state p {
            font-family: 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho Pro', serif;
            font-size: 1rem;
            letter-spacing: 0.18em;
            color: var(--text-muted);
            opacity: 0.6;
            font-weight: 400;
        }

        .home-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; padding: 0 0.2rem; margin-top: 0.1rem; }
        .next-movie-card {
            background: rgba(22,22,28,0.8); backdrop-filter: blur(16px);
            border-radius: var(--radius-xl); padding: 1.2rem; text-align: center; cursor: pointer;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.5s ease;
            border: 1px solid var(--border-default); z-index: 5;
            box-shadow: var(--shadow-md); overflow: hidden; --x: 50%; --y: 50%;
        }
        .next-movie-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(201,168,76,0.25) 0%, transparent 65%);
            opacity: 0.35; pointer-events: none; transition: opacity 0.3s ease; border-radius: var(--radius-xl);
        }
        .next-movie-card:hover::after { opacity: 0.7; }
        .next-movie-card:hover { transform: translateY(-3px); border-color: var(--border-gold); box-shadow: var(--shadow-lg), var(--shadow-gold); }
        .next-movie-card .poster { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 0.8rem; background: #14141a; position: relative; z-index: 1; }
        .ranking-list { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.2rem; }
        .ranking-item {
            position: relative; background: var(--bg-card); border-radius: var(--radius-md);
            padding: 0.9rem 1.2rem; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; border: 1px solid var(--border-default); overflow: hidden;
            min-height: 72px; background-size: cover; background-position: center;
            animation: slideUp 0.3s ease-out both;
            will-change: transform, opacity;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s, background 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .ranking-item::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: inherit; background-size: cover; background-position: center;
            opacity: 0.22; z-index: -2; transition: opacity 0.3s, filter 0.3s, transform 0.3s; filter: blur(8px);
        }
        .ranking-item::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(95deg, rgba(16,16,20,0.92) 0%, rgba(16,16,20,0.7) 28%, rgba(16,16,20,0.55) 55%, rgba(16,16,20,0.7) 78%, rgba(16,16,20,0.92) 100%);
            z-index: -1; transition: background 0.5s;
        }
        .ranking-item:hover::before { filter: blur(2px); opacity: 0.32; transform: scale(1.05); }
        .ranking-item:hover { border-color: var(--border-gold); transform: translateX(4px); box-shadow: var(--shadow-md), 0 0 20px rgba(201,168,76,0.1); }
        .ranking-title { font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem; z-index: 1; position: relative; }
        .ranking-rating { color: var(--gold); font-weight: 700; background: rgba(201,168,76,0.1); padding: 0.3rem 0.7rem; border-radius: 20px; z-index: 1; position: relative; display: inline-flex; align-items: center; gap: 0.4rem; }

        .new-badge {
            display: inline-flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: var(--text-inverse); font-size: 0.58rem; font-weight: 800;
            padding: 0.08rem 0.4rem; border-radius: 10px; letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--gold-glow);
            vertical-align: middle;
            margin-right: 0.4rem;
        }
        .unapproved-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: var(--gold); box-shadow: 0 0 8px var(--gold-glow), 0 0 0 1px rgba(0,0,0,0.4) inset;
            vertical-align: middle;
            animation: pulseDot 1.8s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px var(--gold-glow); }
            50% { opacity: 0.75; transform: scale(1.25); box-shadow: 0 0 14px var(--gold-glow); }
        }

        .carousel-wrapper { width: 100%; height: 100%; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
        .carousel-viewport { width: 100%; height: 100%; position: relative; overflow: hidden; border-radius: var(--radius-lg); background: rgba(18, 18, 24, 0.75); backdrop-filter: blur(18px); border: 1px solid var(--border-default); box-shadow: var(--shadow-lg); touch-action: pan-y; transition: background 0.5s ease, border-color 0.5s ease; }
        .carousel-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; overflow-y: auto; display: flex; flex-direction: column;
        }
        .carousel-slide.active { opacity: 1; pointer-events: auto; z-index: 1; }
        .carousel-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20,20,25,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 25; transition: all 0.2s; opacity: 0.8; font-size: 1.4rem; }
        .carousel-arrow:hover { opacity: 1; color: var(--gold); border-color: var(--gold); }
        .arrow-left { left: -6px; } .arrow-right { right: -6px; }

        .review-card { display: flex; gap: 0.7rem; padding: 0.55rem 0.65rem; border-radius: var(--radius-sm); background: transparent; border: 1px solid transparent; position: relative; align-items: flex-start; }
        .review-card:hover { background: rgba(255,255,255,0.025); border-color: rgba(255,255,255,0.06); }
        .review-card.pending { opacity: 0.65; filter: grayscale(0.2); }
        .spoiler-text { filter: blur(5px); cursor: pointer; transition: filter 0.2s; }
        .spoiler-text.revealed { filter: none; }
        .review-card-actions { position: absolute; top: 0.3rem; right: 0.3rem; display: flex; gap: 0.1rem; opacity: 0; transition: opacity 0.2s, background 0.5s; background: rgba(20,20,25,0.85); backdrop-filter: blur(4px); border-radius: 20px; padding: 0.1rem 0.2rem; }
        .review-card:hover .review-card-actions { opacity: 1; }
        .review-action-icon { background: transparent; border: none; color: #999; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: color 0.2s, background 0.2s; }
        .review-action-icon svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; }
        .approve-btn:hover { color: #4caf84; background: rgba(76,175,132,0.2); }
        .verify-btn:hover { color: #5b9bd5; background: rgba(91,155,213,0.2); }
        .spoiler-btn:hover { color: var(--gold); background: var(--gold-soft-hover); }
        .delete-review-btn:hover, .delete-own-review-btn:hover { color: #e07060; background: rgba(224,112,96,0.2); }

        .movie-title-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; text-align: center;
            font-size: clamp(1.1rem, 4.5vw, 1.8rem); font-weight: 700; color: #fff;
            text-shadow: 0 2px 16px rgba(0,0,0,0.9);
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);

<script>
    (function() {
        // ---- Blokada pinch-zoom w Safari iOS ----
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(evt) {
            document.addEventListener(evt, function(e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener('touchmove', function(e) {
            if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        function getSessionToken() { let t = sessionStorage.getItem('reviewSessionToken'); if (!t) { t = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2,8); sessionStorage.setItem('reviewSessionToken', t); } return t; }
        function getDynamicAdminPassword() { const n = new Date(); return `admin${String(n.getDate()).padStart(2,'0')}${String(n.getMonth()+1).padStart(2,'0')}`; }
        firebase.initializeApp({ apiKey: "AIzaSyDyJDEMa0H4w8krL5vrg9C-oPCIvBDmReE", authDomain: "movie-club-f8ceb.firebaseapp.com", projectId: "movie-club-f8ceb", storageBucket: "movie-club-f8ceb.firebasestorage.app", messagingSenderId: "17251318633", appId: "1:17251318633:web:5080a0bc0243e1a91d1bf8" });
        const db = firebase.firestore();
        firebase.auth().signInAnonymously().catch(e => console.error("Auth error:", e));
        let movies = [], currentMovieIndex = 0, viewMode = 'home', unsubscribeMovies = null, isAdmin = false, adminTimeout = null, currentSlideIndex = 0;
        const ADMIN_DURATION = 5*60*1000;
        const preloadedImages = {};
        let retryTimeout = null;
        let touchStartX = 0;
        let touchStartY = 0;
        window.currentEditMovieId = null;

        let activeMovieId = null;
        let justSubmittedReviewId = null;
        let justSubmittedReviewTimestamp = 0;

        let animeMode = false;
        let scWidget = null;
        let scWidgetReady = false;
        let scWidgetPendingPlay = false;
        let currentFeatured = null;

        const RATING_PRIOR = 3.0;
        const RATING_PRIOR_WEIGHT = 1.5;
        const RANKING_THRESHOLD = 3;

        function getRankingThreshold() { return animeMode ? 1 : RANKING_THRESHOLD; }

        let pendingSnapshotRebuild = false;
        let pendingAuthor = '';
        let pendingComment = '';
        let pendingStars = 0;
        let pendingScrollTop = 0;
        let debounceRebuildTimer = null;
        let loadingTimeout = null;

        function preloadImage(url) { if (!url || preloadedImages[url]) return; preloadedImages[url] = new Promise((resolve) => { const img = new Image(); img.onload = () => { preloadedImages[url] = true; resolve(); }; img.onerror = () => { preloadedImages[url] = false; resolve(); }; img.src = url; }); }
        function showToast(m, type='') { const old = document.querySelector('.toast'); if (old) old.remove(); const t = document.createElement('div'); t.className = 'toast '+type; t.textContent = m; document.body.appendChild(t); requestAnimationFrame(()=> requestAnimationFrame(()=> t.classList.add('show'))); const hide = setTimeout(()=>{ t.classList.remove('show'); t.addEventListener('transitionend', ()=> t.remove(), {once:true}); setTimeout(()=>{ if(t.parentNode) t.remove(); }, 500); }, 2800); t._hideTimeout = hide; }
        function openModal(id) { const m = document.getElementById(id); if(!m) return; m.style.display='flex'; requestAnimationFrame(()=> requestAnimationFrame(()=> m.classList.add('open'))); }
        function closeModal(id) { const m = document.getElementById(id); if(!m) return; m.classList.remove('open'); const h = ()=>{ m.style.display='none'; m.removeEventListener('transitionend', h); }; m.addEventListener('transitionend', h, {once:true}); setTimeout(()=>{ if(!m.classList.contains('open')) { m.style.display='none'; m.removeEventListener('transitionend', h); } }, 350); }
        function updateAdminIndicator() { const indicator = document.getElementById('adminIndicator'); if (!indicator) return; indicator.classList.toggle('active', isAdmin); }
        function setAdminMode(a) { if(adminTimeout) clearTimeout(adminTimeout); isAdmin = a; updateAdminIndicator(); if(a) { sessionStorage.setItem('movieclub_admin','true'); adminTimeout = setTimeout(()=>{ setAdminMode(false); showToast("Sesja admina wygasła."); if(viewMode==='movie') renderMovie(); else renderHome(); }, ADMIN_DURATION); } else { sessionStorage.removeItem('movieclub_admin'); if(adminTimeout) clearTimeout(adminTimeout); adminTimeout = null; } }
        function checkAdminFromStorage() { if(sessionStorage.getItem('movieclub_admin')==='true') setAdminMode(true); }
        function isAdminAction() { if(isAdmin) return true; showToast("Wymagany tryb admina.", 'warning'); return false; }
        function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        function renderStars(r) { let h='<span class="stars">'; for(let i=1;i<=5;i++) h+=`<span class="star ${i<=r?'star-filled':''}" style="color:${i<=r?'var(--gold)':'var(--text-muted)'}">&#9733;</span>`; return h+'</span>'; }
        function avgWeighted(m) {
            let t = 0, w = 0;
            m.reviews.forEach(r => {
                if (r.approved) {
                    const we = r.verified ? 2 : 1;
                    t += r.stars * we;
                    w += we;
                }
            });
            if (w === 0) return '-';
            const raw = t / w;
            const adjusted = (w * raw + RATING_PRIOR_WEIGHT * RATING_PRIOR) / (w + RATING_PRIOR_WEIGHT);
            return adjusted.toFixed(1);
        }
        function countApprovedReviews(m) { return m.reviews.filter(r=>r.approved).length; }
        function parseDate(str) { let p=str.split('.'); return new Date(p[2],p[1]-1,p[0]); }
        function getNextMovie() {
            let today=new Date(); today.setHours(0,0,0,0);
            const pool = movies.filter(m => !!m.isGhibli === animeMode);
            let future = pool.filter(m=>parseDate(m.date)>=today);
            if(future.length) return future.sort((a,b)=>parseDate(a.date)-parseDate(b.date))[0];
            return pool.length?pool.reduce((a,b)=>parseDate(a.date)-parseDate(b.date)>0?a:b):null;
        }

        function getRandomGhibliMovie() {
            const ghibliMovies = movies.filter(m => m.isGhibli);
            if (ghibliMovies.length === 0) return null;
            return ghibliMovies[Math.floor(Math.random() * ghibliMovies.length)];
        }

        function rankScore(m) {
            const w = avgWeighted(m);
            return w === '-' ? -Infinity : parseFloat(w);
        }
        function rankCompare(a, b) {
            const sa = rankScore(a);
            const sb = rankScore(b);
            if (sa !== sb) return sb - sa;
            return String(a.id || '').localeCompare(String(b.id || ''));
        }

        function getRankedMovies() {
            const thr = getRankingThreshold();
            const pool = movies.filter(m => !!m.isGhibli === animeMode);
            const high = pool.filter(m => countApprovedReviews(m) >= thr);
            const low = pool.filter(m => countApprovedReviews(m) < thr);
            high.sort(rankCompare);
            low.sort(rankCompare);
            return [...high, ...low];
        }

        function isGraveMovie(m) {
            if (!m) return false;
            const t = (m.title || '').toLowerCase();
            return t.includes('grobowiec') ||
                   t.includes('świetlik') || t.includes('swietlik') ||
                   t.includes('firefl') ||
                   t.includes('hotaru') ||
                   (m.id && m.id.toLowerCase().includes('grave'));
        }

        function getCurrentDisplayedMovie() {
            if (viewMode === 'movie') {
                const ranked = getRankedMovies();
                if (activeMovieId) {
                    const m = ranked.find(x => x.id === activeMovieId);
                    if (m) return m;
                }
                return ranked[currentSlideIndex] || null;
            }
            return currentFeatured || null;
        }

        function getMovieAddedTime(m) {
            if (!m) return null;
            if (m.createdAt) {
                return typeof m.createdAt === 'number' ? m.createdAt : new Date(m.createdAt).getTime();
            }
            if (m.id && typeof m.id === 'string' && m.id.startsWith('movie_')) {
                const ts = parseInt(m.id.split('_')[1], 10);
                if (!isNaN(ts)) return ts;
            }
            return null;
        }
        const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
        function isNewMovie(m) {
            const t = getMovieAddedTime(m);
            if (!t) return false;
            return (Date.now() - t) < ONE_WEEK_MS;
        }
        function hasUnapprovedReviews(m) {
            return Array.isArray(m.reviews) && m.reviews.some(r => !r.approved);
        }

        const SVG_ICONS = {
            approve: '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>',
            verify: '<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>',
            delete: '<svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>',
            edit: '<svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
            spoiler: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
        };

        function setupStarSelector(container) {
            if (!container) return;
            const stars = container.querySelectorAll('.star-select');
            container.onmouseover = e => {
                const s = e.target.closest('.star-select');
                if (s) stars.forEach(st => st.style.color = parseInt(st.dataset.value) <= parseInt(s.dataset.value) ? 'var(--gold)' : 'var(--text-muted)');
            };
            container.onmouseleave = () => stars.forEach(s => s.style.color = s.classList.contains('selected') ? 'var(--gold)' : 'var(--text-muted)');
            container.onclick = e => {
                const s = e.target.closest('.star-select');
                if (s) stars.forEach(st => {
                    st.classList.toggle('selected', parseInt(st.dataset.value) <= parseInt(s.dataset.value));
                    st.style.color = st.classList.contains('selected') ? 'var(--gold)' : 'var(--text-muted)';
                });
            };
        }

        function captureReviewFormState() {
            const slide = document.querySelector('.carousel-slide.active');
            if (!slide) return;
            const authorEl = slide.querySelector('.review-author-input');
            const commentEl = slide.querySelector('.review-comment-input');
            const stars = slide.querySelectorAll('.rating-input .star-select.selected').length;
            if (authorEl) pendingAuthor = authorEl.value;
            if (commentEl) pendingComment = commentEl.value;
            pendingStars = stars;
            pendingScrollTop = slide.scrollTop;
            pendingSnapshotRebuild = true;
        }

        function restoreReviewFormState() {
            if (!pendingSnapshotRebuild) return;
            const slide = document.querySelector('.carousel-slide.active');
            if (!slide) { pendingSnapshotRebuild = false; return; }
            const authorEl = slide.querySelector('.review-author-input');
            const commentEl = slide.querySelector('.review-comment-input');
            const starEls = slide.querySelectorAll('.rating-input .star-select');
            if (authorEl) authorEl.value = pendingAuthor;
            if (commentEl) commentEl.value = pendingComment;
            starEls.forEach(s => {
                const val = parseInt(s.dataset.value);
                if (val <= pendingStars) {
                    s.classList.add('selected');
                    s.style.color = 'var(--gold)';
                } else {
                    s.classList.remove('selected');
                    s.style.color = 'var(--text-muted)';
                }
            });
            slide.scrollTop = pendingScrollTop;
            pendingSnapshotRebuild = false;
            pendingAuthor = '';
            pendingComment = '';
            pendingStars = 0;
            pendingScrollTop = 0;
        }

        function generateMovieSlide(movie) {
            const sorted = [...movie.reviews].sort((a,b)=> a.verified!==b.verified ? (a.verified?-1:1) : (a.approved!==b.approved ? (a.approved?-1:1) : b.timestamp-a.timestamp));
            let revHtml = '';
            const curToken = getSessionToken();
            if(sorted.length===0) revHtml = `<div class="empty-state"><p>レビューはまだありません</p></div>`;
            else sorted.forEach(r=>{
                const origIdx = movie.reviews.findIndex(o=>o.timestamp===r.timestamp && o.author===r.author);
                const pending = !r.approved?'pending':'';
                const verifiedMark = r.verified?'<span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:rgba(201,168,76,0.12);color:rgba(201,168,76,0.55);font-size:0.5rem;margin-left:0.2rem;">✓</span>':'';
                const canEdit = (!r.approved && r.sessionToken===curToken);
                let btns = '';
                if (!r.approved) {
                    if (isAdmin) btns += `<button class="review-action-icon approve-btn" data-idx="${origIdx}">${SVG_ICONS.approve}</button>`;
                    if (canEdit) {
                        btns += `<button class="review-action-icon edit-review-btn" data-idx="${origIdx}" data-movie-id="${movie.id}">${SVG_ICONS.edit}</button>`;
                        btns += `<button class="review-action-icon delete-own-review-btn" data-idx="${origIdx}" data-movie-id="${movie.id}">${SVG_ICONS.delete}</button>`;
                    }
                    if (isAdmin && !canEdit) btns += `<button class="review-action-icon delete-review-btn" data-idx="${origIdx}">${SVG_ICONS.delete}</button>`;
                } else {
                    if (isAdmin) {
                        if (!r.verified) btns += `<button class="review-action-icon verify-btn" data-idx="${origIdx}">${SVG_ICONS.verify}</button>`;
                        btns += `<button class="review-action-icon spoiler-btn" data-idx="${origIdx}" title="Spoiler">${SVG_ICONS.spoiler}</button>`;
                        btns += `<button class="review-action-icon delete-review-btn" data-idx="${origIdx}">${SVG_ICONS.delete}</button>`;
                    }
                }
                const commentClass = r.spoiler ? 'review-comment spoiler-text' : 'review-comment';
                revHtml += `<div class="review-card ${pending}"><div class="review-card-left-col" style="flex:0 0 75px;">${renderStars(r.stars)}<div style="font-size:0.7rem;color:var(--text-muted);">${escapeHtml(r.author)}${verifiedMark}</div></div><div class="review-card-right-col"><div class="${commentClass}" onclick="if(this.classList.contains('spoiler-text')) this.classList.toggle('revealed')" style="font-size:0.78rem;line-height:1.5;">${escapeHtml(r.comment)}</div></div><div class="review-card-actions">${btns}</div></div>`;
            });
            const sent = movie.sentimentalValue ? `<div style="margin:0.5rem;padding:0.5rem;background:rgba(201,168,76,0.05);border-left:2px solid var(--gold);font-size:0.7rem;color:var(--text-secondary);">${escapeHtml(movie.sentimentalValue)}</div>` : '';
            const dateHtml = (!animeMode && movie.date)
                ? `<div style="text-align:center;font-size:0.7rem;color:var(--text-muted);margin:0.4rem 0;">${escapeHtml(movie.date)}</div>`
                : '';
            const reviewsPadding = animeMode ? '0.7rem 0.9rem 0' : '0.4rem 0.9rem 0';

            const posterUrl = movie.poster || '';
            const posterImg = posterUrl ? `<img class="poster-img" src="${escapeHtml(posterUrl)}" style="width:100%;height:100%;object-fit:cover;">` : `<div style="width:100%;height:100%;background:linear-gradient(135deg, #c8dcc8, #e8d8b8);display:flex;align-items:center;justify-content:center;color:#7a8a7a;font-family:'Noto Serif JP',serif;font-size:1.4rem;">${animeMode?'森':'Brak plakatu'}</div>`;
            const avg = avgWeighted(movie); const avgDisp = avg!=='-'?avg:'-';
            const linkHtml = movie.link ? `<div style="text-align:center;margin:0.3rem 0;"><a href="${escapeHtml(movie.link)}" target="_blank" style="color:var(--gold);font-size:0.7rem;">Link do filmu</a></div>` : '';
            const jfUrl = `https://jellyfin.shepardgepard.org/web/#/search.html?query=${encodeURIComponent(movie.title)}`;
            const editBtnAdminVisible = isAdmin ? ' admin-visible' : '';
            return `<div class="carousel-slide" data-movie-id="${movie.id}"><div style="display:flex;flex-direction:column;height:100%;"><div style="height:clamp(180px,30vh,280px);position:relative;overflow:hidden;flex-shrink:0;background:#1a1a20;">${posterImg}<a href="${jfUrl}" target="_blank" class="movie-title-overlay">${escapeHtml(movie.title)}</a><button class="review-action-icon edit-movie-btn${editBtnAdminVisible}" data-movie-id="${movie.id}" style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);color:#ddd;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:opacity 0.2s;">${SVG_ICONS.edit}</button></div>${dateHtml}${linkHtml}<div style="flex:1;overflow-y:auto;padding:${reviewsPadding};display:flex;flex-direction:column;">${revHtml}</div>${sent}<div style="background:var(--bg-elevated);border-top:1px solid var(--border-default);padding:0.7rem 0.9rem;transition:background 0.5s;"><div style="display:flex;gap:0.55rem;align-items:stretch;"><div style="flex:0 0 88px;display:flex;flex-direction:column;gap:0.25rem;"><input type="text" class="review-author-input" placeholder="Imię" maxlength="9" style="background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:0.4rem;font-size:0.7rem;color:var(--text-primary);text-align:center;font-family:inherit;width:100%;"><div class="rating-input" style="display:flex;gap:0;background:var(--bg-input);padding:0.15rem 0.25rem;border-radius:20px;justify-content:center;border:1px solid var(--border-default);">${[1,2,3,4,5].map(n=>`<span class="star-select" data-value="${n}" style="font-size:0.75rem;cursor:pointer;color:var(--text-muted);">&#9733;</span>`).join('')}</div></div><div style="flex:2;min-width:0;"><textarea class="review-comment-input" placeholder="Napisz kilka słów...\nKliknij enter aby wysłać." style="width:100%;height:100%;min-height:42px;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:0.45rem;font-size:0.7rem;color:var(--text-primary);resize:none;font-family:inherit;"></textarea></div><div class="avg-box" data-movie-id="${movie.id}" style="flex:0 0 52px;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);cursor:pointer;font-size:0.85rem;">${avgDisp} ★</div></div></div></div></div>`;
        }

        function addSwipeSupport() {
            const viewport = document.getElementById('carouselViewport');
            if (!viewport) return;
            viewport.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: true});
            viewport.addEventListener('touchend', e => {
                if (touchStartX === 0 && touchStartY === 0) return;
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) nextSlide();
                    else prevSlide();
                }
                touchStartX = 0;
                touchStartY = 0;
            });
        }

        function buildCarousel(idx) {
            const c = document.getElementById('mainContent');
            c.style.overflow = 'visible';
            c.innerHTML = `<div class="carousel-wrapper"><div class="carousel-viewport" id="carouselViewport"></div><button class="carousel-arrow arrow-left" id="carouselPrevBtn">&lsaquo;</button><button class="carousel-arrow arrow-right" id="carouselNextBtn">&rsaquo;</button></div>`;
            const viewport = document.getElementById('carouselViewport');
            const ranked = getRankedMovies();
            ranked.forEach((m,i)=>{
                const d = document.createElement('div');
                d.innerHTML = generateMovieSlide(m);
                const slide = d.firstChild;
                if(i === idx) slide.classList.add('active');
                viewport.appendChild(slide);
            });
            currentSlideIndex = idx;
            currentMovieIndex = idx;
            activeMovieId = ranked[idx]?.id || null;
            setGlobalBackground(ranked[idx]?.poster);
            updateEffects();
            attachDelegatedEvents();
            document.getElementById('carouselPrevBtn').onclick = prevSlide;
            document.getElementById('carouselNextBtn').onclick = nextSlide;
            addSwipeSupport();
        }

        function setGlobalBackground(url) {
            const bg = document.getElementById('globalBg');
            if (!bg) return;
            bg.style.filter = '';
            bg.style.opacity = '';
            if (!url) { bg.style.backgroundImage = 'none'; return; }
            if (preloadedImages[url] === true) {
                bg.style.backgroundImage = `url('${url}')`;
            } else {
                const img = new Image();
                img.onload = () => { preloadedImages[url] = true; bg.style.backgroundImage = `url('${url}')`; };
                img.src = url;
                preloadedImages[url] = img;
            }
        }

        function goToSlide(i) {
            const ranked = getRankedMovies();
            if(i < 0) i = ranked.length - 1;
            if(i >= ranked.length) i = 0;
            if(i === currentSlideIndex) return;
            const viewport = document.getElementById('carouselViewport');
            if(!viewport) return;
            const slides = viewport.querySelectorAll('.carousel-slide');
            if(slides[currentSlideIndex]) slides[currentSlideIndex].classList.remove('active');
            if(slides[i]) {
                slides[i].classList.add('active');
                slides[i].scrollTop = 0;
            }
            currentSlideIndex = i;
            currentMovieIndex = i;
            activeMovieId = ranked[i]?.id || null;
            setGlobalBackground(ranked[i]?.poster);
            updateEffects();
            attachDelegatedEvents();
        }

            const rankingDiv = document.getElementById('rankingList');
            if(rankingDiv) {
                const thr = getRankingThreshold();
                const all = getRankedMovies();
                if(all.length === 0) rankingDiv.innerHTML = '<div class="empty-state"><p>'+(animeMode?'Brak filmów Ghibli w rankingu.':'Brak filmów w rankingu.')+'</p></div>';
                else rankingDiv.innerHTML = all.map((m,idx) => {
                    const rating = avgWeighted(m);
                    const approvedCount = countApprovedReviews(m);
                    const enough = approvedCount >= thr;
                    const ratingTxt = enough ? (rating !== '-' ? `${rating} ★` : '- ★') : '-';
                    const badge = (!enough && !animeMode) ? '<span style="font-size:0.7rem;color:var(--text-muted);">(czeka na więcej ocen)</span>' : '';
                    const newBadge = (!animeMode && isNewMovie(m)) ? '<span class="new-badge" title="Dodany w ostatnim tygodniu">N</span>' : '';
                    const pendingDot = hasUnapprovedReviews(m) ? '<span class="unapproved-dot" title="Oczekuje na akceptację ocen"></span>' : '';
                    const ratingTitle = enough
                        ? `Średnia ważona: ${rating} (z ${approvedCount} zatwierdzonych ocen)`
                        : 'Za mało ocen do wyświetlenia średniej';
                    const posterStyle = m.poster ? `background-image:url('${escapeHtml(m.poster)}');background-size:cover;background-position:center;` : (animeMode ? 'background:linear-gradient(120deg, rgba(200,220,200,0.6), rgba(232,216,184,0.6));' : ' ');
                    return `<div class="ranking-item" data-idx="${idx}" style="${posterStyle}"><span class="ranking-title">${idx+1}. ${escapeHtml(m.title)}${pendingDot}${badge}</span><span class="ranking-rating" title="${ratingTitle}">${newBadge}${ratingTxt}</span></div>`;
                }).join('');
            }
            document.querySelectorAll('.ranking-item').forEach(el => {
                el.onclick = () => {
                    const idx = parseInt(el.dataset.idx);
                    if(!isNaN(idx) && getRankedMovies()[idx]) {
                        currentMovieIndex = idx;
                        switchToMovie();
                    }
                };
            });
            const nextCard = document.getElementById('nextMovieCard');
            if (nextCard && featured) {
                nextCard.onclick = () => {
                    const ranked = getRankedMovies();
                    const i = ranked.findIndex(m => m.id === featured.id);
                    if (i !== -1) {
                        currentMovieIndex = i;
                        switchToMovie();
                    }
                };
                nextCard.addEventListener('mousemove', e => {
                    const r = nextCard.getBoundingClientRect();
                    nextCard.style.setProperty('--x', `${((e.clientX - r.left) / r.width) * 100}%`);
                    nextCard.style.setProperty('--y', `${((e.clientY - r.top) / r.height) * 100}%`);
                });
                nextCard.addEventListener('mouseleave', () => {
                    nextCard.style.removeProperty('--x');
                    nextCard.style.removeProperty('--y');
                });
            }
            updateEffects();
        }

        // ---- Aktualizacja koloru paska przeglądarki (Safari 26 + Chrome + Android) ----
        // Kolor pasków jest teraz przekazywany przez zmienną CSS --ios-theme-bg,
        // którą odczytują pseudoelementy ::before obu wskaźników. Dzięki temu
        // Safari widzi "pusty" fixed element z tłem ustawionym przez pseudoelement
        // i potrafi poprawnie próbkować kolor dla dolnego paska.
        function updateThemeColor() {
            const isLight = animeMode && !document.body.classList.contains('grave-mode');
            const color = isLight ? '#e8e0c8' : '#08080b';

            // 1. Meta theme-color – Chrome, Android, częściowo Safari
            let meta = document.querySelector('meta[name="theme-color"]');
            if (!meta) {
                meta = document.createElement('meta');
                meta.name = 'theme-color';
                document.head.appendChild(meta);
            }
            meta.setAttribute('content', color);

            // 2. Meta color-scheme
            let metaCS = document.querySelector('meta[name="color-scheme"]');
            if (metaCS) metaCS.setAttribute('content', isLight ? 'light' : 'dark');

            // 3. Kolor tła <html> i <body> – dodatkowe wskazówki dla Safari
            document.documentElement.style.backgroundColor = color;
            document.body.style.backgroundColor = color;

            // 4. color-scheme na <html>
            document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';

            // 5. KLUCZOWE: kolor obu pasków idzie przez zmienną CSS,
            //    ustawioną na <html>, odczytywaną przez ::before.
            document.documentElement.style.setProperty('--ios-theme-bg', color);

            // 6. Wymuś reflow, żeby Safari zauważył zmianę
            void document.documentElement.offsetHeight;
        }

        function updateEffects() {
            if (!animeMode) {
                document.body.classList.remove('grave-mode');
                clearLeaves();
                clearGraveParticles();
                updateThemeColor();
                return;
            }
            const movie = getCurrentDisplayedMovie();
            const grave = isGraveMovie(movie);
            document.body.classList.toggle('grave-mode', grave);
            if (grave) {
                clearLeaves();
                spawnGraveParticles();
            } else {
                clearGraveParticles();
                spawnLeaves();
            }
            updateThemeColor();
        }

        async function loadProposals() {
            const div = document.getElementById('proposalsList');
            if(!div) return;
            div.innerHTML = 'Ładowanie...';
            try {
                const snap = await db.collection("proposals").orderBy("votes","desc").get();
                const props = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(props.length === 0) {
                    div.innerHTML = '<div class="empty-state"><p>Brak propozycji.</p></div>';
                    return;
                }
                const voted = JSON.parse(localStorage.getItem('proposal_votes') || '[]');
                div.innerHTML = props.map(p => `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0.7rem;background:var(--bg-elevated);border-radius:var(--radius-sm);margin-bottom:0.3rem;border:1px solid var(--border-default);"><span style="font-size:0.85rem;">${escapeHtml(p.title)}</span><div class="proposal-vote ${voted.includes(p.id)?'voted':''}" data-id="${p.id}" style="background:var(--bg-input);padding:0.3rem 0.6rem;border-radius:20px;cursor:pointer;font-size:0.75rem;transition:all 0.2s;">${p.votes||0} ${voted.includes(p.id)?'✓':'+1'}</div></div>`).join('');
                document.querySelectorAll('.proposal-vote').forEach(el => {
                    el.onclick = async () => {
                        const id = el.dataset.id;
                        let arr = JSON.parse(localStorage.getItem('proposal_votes') || '[]');
                        if(arr.includes(id)) {
                            showToast("Już zagłosowałeś na tę propozycję");
                            return;
                        }
                        await db.collection("proposals").doc(id).update({votes: firebase.firestore.FieldValue.increment(1)});
                        arr.push(id);
                        localStorage.setItem('proposal_votes', JSON.stringify(arr));
                        loadProposals();
                    };
                });
            } catch(e) {
                div.innerHTML = 'Błąd.';
            }
        }

            document.querySelectorAll('.edit-movie-btn').forEach(b => b.onclick = e => {
                e.stopPropagation();
                if(!isAdmin) {
                    showToast("Wymagany tryb admina.", 'warning');
                    return;
                }
                const movie = movies.find(m => m.id === b.dataset.movieId);
                if(!movie) return;
                window.currentEditMovieId = movie.id;
                document.getElementById('editTitle').value = movie.title;
                document.getElementById('editDate').value = movie.date.split('.').reverse().join('-');
                document.getElementById('editPosterUrl').value = movie.poster || '';
                document.getElementById('editLink').value = movie.link || '';
                document.getElementById('editSentimental').value = movie.sentimentalValue || '';
                openModal('editMovieModal');
            });
        }

        async function submitReview(movieId, slide) {
            const author = slide.querySelector('.review-author-input').value.trim();
            const comment = slide.querySelector('.review-comment-input').value.trim();
            const stars = slide.querySelectorAll('.rating-input .star-select.selected').length;
            if(!author) return showToast("Podaj imię.");
            if(stars === 0) return showToast("Wybierz ocenę.");
            const movie = movies.find(m => m.id === movieId);
            if(!movie) return;

            justSubmittedReviewId = movieId;
            justSubmittedReviewTimestamp = Date.now();

            movie.reviews.push({author, stars, comment, spoiler: false, approved: false, verified: false, timestamp: Date.now(), sessionToken: getSessionToken()});

            slide.querySelector('.review-author-input').value = '';
            slide.querySelector('.review-comment-input').value = '';
            slide.querySelectorAll('.rating-input .star-select').forEach(s => {
                s.classList.remove('selected');
                s.style.color = 'var(--text-muted)';
            });

            await db.collection("movies").doc(movieId).update({reviews: movie.reviews});
            showToast("Recenzja dodana.");
        }

        async function seedDefault() {
            if((await db.collection("movies").get()).empty)
                for(const m of defaultMoviesData) await db.collection("movies").doc(m.id).set(m);
        }

        function showLoading(s) {
            const ld = document.querySelector('.loading-indicator');
            if (!ld) return;
            ld.style.display = s ? 'flex' : 'none';
            if (s) {
                if (loadingTimeout) clearTimeout(loadingTimeout);
                loadingTimeout = setTimeout(() => {
                    const ld2 = document.querySelector('.loading-indicator');
                    if (ld2 && ld2.style.display !== 'none') {
                        ld2.innerHTML = '<div style="text-align:center;color:#e07060;">⚠️ Nie udało się załadować.<br><button onclick="location.reload()" style="margin-top:0.5rem;background:var(--gold);border:none;padding:0.5rem 1rem;border-radius:20px;cursor:pointer;color:#000;font-family:inherit;">Odśwież stronę</button></div>';
                    }
                }, 12000);
            } else {
                if (loadingTimeout) clearTimeout(loadingTimeout);
                loadingTimeout = null;
            }
        }

        function startListener(attempt = 0) {
            if (unsubscribeMovies) unsubscribeMovies();
            showLoading(true);
            if (retryTimeout) clearTimeout(retryTimeout);

            db.collection("movies").get().then(async snap => {
                if (snap.empty) {
                    await seedDefault();
                }
                await seedGhibliMovies();
            }).then(() => {
                unsubscribeMovies = db.collection("movies").onSnapshot(snap => {
                    if (retryTimeout) { clearTimeout(retryTimeout); retryTimeout = null; }

                    let oldMovieId = activeMovieId;
                    if (viewMode === 'movie' && movies.length > 0) {
                        if (!oldMovieId) {
                            const rankedOld = getRankedMovies();
                            oldMovieId = rankedOld[currentMovieIndex]?.id || null;
                        }
                        captureReviewFormState();
                    }

                    movies = [];
                    snap.forEach(d => movies.push(d.data()));

                    const ranked = getRankedMovies();
                    if(ranked.length === 0) {
                        if(viewMode === 'home') renderHome();
                        else switchToHome();
                    } else {
                        if(viewMode === 'home') renderHome();
                        else {
                            let focusId = oldMovieId;
                            if (justSubmittedReviewId && (Date.now() - justSubmittedReviewTimestamp) < 4000) {
                                focusId = justSubmittedReviewId;
                            } else {
                                justSubmittedReviewId = null;
                            }
                            let newIdx = focusId ? ranked.findIndex(m => m.id === focusId) : -1;
                            if(newIdx < 0) newIdx = 0;
                            currentMovieIndex = newIdx;
                            activeMovieId = ranked[newIdx]?.id || null;
                            buildCarousel(newIdx);
                        }
                    }

                    if (viewMode === 'movie') {
                        setTimeout(restoreReviewFormState, 80);
                    }

                    showLoading(false);
                }, err => {
                    showToast("Błąd odczytu – ponawiam...", 'warning');
                    showLoading(false);
                    retryTimeout = setTimeout(() => startListener(attempt + 1), 3000);
                });
            }).catch(e => {
                showLoading(false);
                showToast("Błąd połączenia – ponawiam...", 'warning');
                retryTimeout = setTimeout(() => startListener(attempt + 1), 3000);
            });
        }

        function renderMovie() {
            if(getRankedMovies().length > 0) buildCarousel(currentMovieIndex);
            else switchToHome();
        }

        async function exportJSON() {
            try {
                const data = movies;
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'movieclub_backup_' + new Date().toISOString().slice(0,10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast("Eksport JSON pobrany.");
            } catch(e) {
                showToast("Błąd eksportu JSON.");
            }
        }

        async function exportCSV() {
            try {
                let csv = 'Tytuł;Data;Plakat;Link;Cytat;Średnia;Liczba recenzji\n';
                movies.forEach(m => {
                    const avg = avgWeighted(m);
                    const count = countApprovedReviews(m);
                    csv += `"${m.title}";"${m.date}";"${m.poster||''}";"${m.link||''}";"${m.sentimentalValue||''}";"${avg}";"${count}"\n`;
                });
                const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'movieclub_ranking_' + new Date().toISOString().slice(0,10) + '.csv';
                a.click();
                URL.revokeObjectURL(url);
                showToast("Eksport CSV pobrany.");
            } catch(e) {
                showToast("Błąd eksportu CSV.");
            }
        }

        async function importDatabase(file) {
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                if(!Array.isArray(data)) throw new Error('Nieprawidłowy format');
                if(!confirm(`Zaimportować ${data.length} filmów? Obecne dane zostaną nadpisane.`)) return;
                const existingSnap = await db.collection("movies").get();
                const batch = db.batch();
                existingSnap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                for(const movie of data) {
                    if(movie.id && movie.title) {
                        const payload = {
                            id: movie.id,
                            title: movie.title,
                            date: movie.date || '',
                            poster: movie.poster || '',
                            link: movie.link || '',
                            sentimentalValue: movie.sentimentalValue || '',
                            reviews: movie.reviews || [],
                            ...(movie.createdAt ? { createdAt: movie.createdAt } : {}),
                            ...(movie.isGhibli ? { isGhibli: true } : {})
                        };
                        await db.collection("movies").doc(movie.id).set(payload);
                    }
                }
                await seedGhibliMovies();
                showToast("Import zakończony pomyślnie.");
                closeModal('dbManageModal');
            } catch(e) {
                showToast("Błąd importu: " + e.message);
            }
        }

        document.getElementById('animeToggleBtn').onclick = toggleAnimeMode;
        document.getElementById('dbManageBtn').onclick = () => { if(!isAdmin) { isAdminAction(); return; } openModal('dbManageModal'); };
        document.getElementById('proposeHeaderBtn').onclick = () => { loadProposals(); openModal('proposeModal'); };
        document.getElementById('homeBtn').onclick = () => { if(viewMode !== 'home') switchToHome(); };
        document.getElementById('cancelModalBtn').onclick = () => closeModal('movieModal');
        document.getElementById('cancelEditBtn').onclick = () => closeModal('editMovieModal');

        document.getElementById('saveMovieBtn').onclick = async () => {
            const title = document.getElementById('newTitle').value.trim();
            const dateVal = document.getElementById('newDate').value;
            const poster = document.getElementById('newPosterUrl').value.trim();
            const link = document.getElementById('newLink').value.trim();
            const sentimental = document.getElementById('newSentimental').value.trim();
            if(!title) { showToast('Podaj tytuł.'); return; }
            const dateFormatted = dateVal ? dateVal.split('-').reverse().join('.') : '';
            const id = 'movie_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
            await db.collection("movies").doc(id).set({
                id, title, date: dateFormatted, poster, link, sentimentalValue: sentimental, reviews: [],
                createdAt: Date.now(),
                ...(animeMode ? { isGhibli: true } : {})
            });
            document.getElementById('newTitle').value = '';
            document.getElementById('newDate').value = '';
            document.getElementById('newPosterUrl').value = '';
            document.getElementById('newLink').value = '';
            document.getElementById('newSentimental').value = '';
            closeModal('movieModal');
            showToast('Film dodany.');
        };

        document.getElementById('saveEditBtn').onclick = async () => {
            const id = window.currentEditMovieId;
            if(!id) return;
            const title = document.getElementById('editTitle').value.trim();
            const dateVal = document.getElementById('editDate').value;
            const poster = document.getElementById('editPosterUrl').value.trim();
            const link = document.getElementById('editLink').value.trim();
            const sentimental = document.getElementById('editSentimental').value.trim();
            const dateFormatted = dateVal ? dateVal.split('-').reverse().join('.') : '';
            await db.collection("movies").doc(id).update({
                title, date: dateFormatted, poster, link, sentimentalValue: sentimental
            });
            closeModal('editMovieModal');
            showToast('Film zaktualizowany.');
        };

        document.getElementById('deleteMovieFromEditBtn').onclick = async () => {
            const id = window.currentEditMovieId;
            if(!id) return;
            if(!confirm("Na pewno usunąć ten film?")) return;
            await db.collection("movies").doc(id).delete();
            closeModal('editMovieModal');
            showToast('Film usunięty.');
        };

        document.getElementById('exportDbBtn').onclick = exportJSON;
        document.getElementById('exportCsvBtn').onclick = exportCSV;
        document.getElementById('performImportBtn').onclick = () => document.getElementById('importFileInput').click();
        document.getElementById('importFileInput').onchange = e => { if(e.target.files[0]) importDatabase(e.target.files[0]); };
        document.getElementById('closeDbModalBtn').onclick = () => closeModal('dbManageModal');
        document.getElementById('addMovieFromDbBtn').onclick = () => { closeModal('dbManageModal'); setTimeout(() => openModal('movieModal'), 360); };
        document.getElementById('homeLogo').onclick = () => { if(viewMode !== 'home') switchToHome(); };
        document.getElementById('cancelProposeBtn').onclick = () => closeModal('proposeModal');

        document.getElementById('submitProposeBtn').onclick = async () => {
            const title = document.getElementById('proposeTitle').value.trim();
            if(!title) { showToast('Podaj tytuł propozycji.'); return; }
            await db.collection("proposals").add({title, votes: 0});
            document.getElementById('proposeTitle').value = '';
            loadProposals();
            showToast('Propozycja dodana.');
        };

        document.getElementById('cancelEditReviewBtn').onclick = () => closeModal('editReviewModal');

        document.getElementById('saveEditReviewBtn').onclick = async () => {
            const modal = document.getElementById('editReviewModal');
            const movieId = modal.dataset.movieId;
            const reviewIdx = parseInt(modal.dataset.reviewIdx);
            const movie = movies.find(m => m.id === movieId);
            if(!movie || isNaN(reviewIdx) || !movie.reviews[reviewIdx]) return;
            const stars = document.querySelectorAll('#editStarSelector .star-select.selected').length;
            const comment = document.getElementById('editReviewComment').value.trim();
            if(stars === 0) { showToast('Wybierz ocenę.'); return; }
            movie.reviews[reviewIdx].stars = stars;
            movie.reviews[reviewIdx].comment = comment;
            await db.collection("movies").doc(movieId).update({reviews: movie.reviews});
            closeModal('editReviewModal');
            showToast('Recenzja zaktualizowana.');
        };

        window.onclick = e => { if(e.target.classList.contains('modal') && e.target.classList.contains('open')) closeModal(e.target.id); };
        document.getElementById('adminIndicator').onclick = (e) => { e.stopPropagation(); if (isAdmin) { setAdminMode(false); showToast("Tryb admina wyłączony."); if (viewMode === 'movie') renderMovie(); else renderHome(); } };

        document.addEventListener('keydown', (e) => {
            if (viewMode !== 'movie') return;
            const ae = document.activeElement;
            if (ae) {
                const tag = ae.tagName ? ae.tagName.toLowerCase() : '';
                if (tag === 'input' || tag === 'textarea' || ae.isContentEditable) return;
            }
            if (document.querySelector('.modal.open')) return;
            if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
        });

        const defaultMoviesData = [
            {
                id: 'default_start',
                title: 'Przykładowy seans',
                date: '01.01.2026',
                poster: '',
                link: '',
                sentimentalValue: '',
                reviews: []
            }
        ];

        checkAdminFromStorage();
        updateAdminIndicator();
        applyAnimeMode(false);
        updateThemeColor();

        const unlockMusicOnce = () => {
            initSoundCloudWidget();
            if (animeMode) playAnimeMusic();
            document.removeEventListener('click', unlockMusicOnce);
            document.removeEventListener('touchstart', unlockMusicOnce);
        };
        document.addEventListener('click', unlockMusicOnce);
        document.addEventListener('touchstart', unlockMusicOnce);

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            if (!animeMode) return;
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const wasGrave = document.body.classList.contains('grave-mode');
                clearLeaves();
                clearGraveParticles();
                if (wasGrave) spawnGraveParticles();
                else spawnLeaves();
            }, 400);
        });

        startListener();
    })();
</script>
</body>
</html>
